<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 我的元素世界 — AI 创造营第6课</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;user-select:none}
canvas{display:block;cursor:crosshair}
.toolbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px 12px;border-radius:18px;background:rgba(10,14,26,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);z-index:10;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.tb{width:44px;height:44px;border:2px solid rgba(255,255,255,.18);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(255,255,255,.05);transition:all .2s}
.tb:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.tb.active{border-color:#ffd700;background:rgba(255,215,0,.18);box-shadow:0 0 12px rgba(255,215,0,.3)}
.tb .ic{font-size:18px}.tb .lb{font-size:7px;color:#aaa;font-weight:700}.tb.active .lb{color:#ffd700}
.title{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#ffd700;font-size:16px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 12px rgba(255,215,0,.4);z-index:10;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">🌍 我的元素世界 · 9种元素</div>
<div class="toolbar" id="tb"></div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,cols,rows,grid,nxt;
const S=4;
const EMPTY=0,SAND=1,WATER=2,FIRE=3,WOOD=4,OIL=5,STONE=6,LAVA=7,GOLD=8,ERASE=9;
const TOOLS=[
  {id:'sand',ic:'🏜️',lb:'沙子',tp:SAND},
  {id:'water',ic:'💧',lb:'水',tp:WATER},
  {id:'fire',ic:'🔥',lb:'火',tp:FIRE},
  {id:'wood',ic:'🌳',lb:'木头',tp:WOOD},
  {id:'oil',ic:'🛢️',lb:'油',tp:OIL},
  {id:'stone',ic:'🪨',lb:'石头',tp:STONE},
  {id:'lava',ic:'🌋',lb:'岩浆',tp:LAVA},
  {id:'gold',ic:'✨',lb:'黄金',tp:GOLD},
  {id:'erase',ic:'🧹',lb:'橡皮擦',tp:ERASE},
];
let curTool=TOOLS[0];

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/S);rows=Math.ceil(H/S);const o=grid;grid=new Uint8Array(cols*rows);nxt=new Uint8Array(cols*rows);if(o&&o.length===cols*rows)grid.set(o)}
resize();addEventListener('resize',resize);

const tb=document.getElementById('tb');
TOOLS.forEach(t=>{
  const b=document.createElement('div');b.className='tb'+(t===curTool?' active':'');
  b.innerHTML=`<span class="ic">${t.ic}</span><span class="lb">${t.lb}</span>`;
  b.onclick=()=>{curTool=t;tb.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));b.classList.add('active')};
  tb.appendChild(b);
});

let drawing=false,lx=-1,ly=-1;
cv.onmousedown=e=>{drawing=true;paint(e.clientX,e.clientY)};
cv.onmousemove=e=>{if(drawing)paint(e.clientX,e.clientY)};
cv.onmouseup=cv.onmouseleave=()=>{drawing=false;lx=ly=-1};
cv.ontouchstart=e=>{e.preventDefault();drawing=true;paint(e.touches[0].clientX,e.touches[0].clientY)};
cv.ontouchmove=e=>{e.preventDefault();if(drawing)paint(e.touches[0].clientX,e.touches[0].clientY)};
cv.ontouchend=()=>{drawing=false;lx=ly=-1};

function paint(mx,my){
  const tx=Math.floor(mx/S),ty=Math.floor(my/S),tp=curTool.tp,R=3;
  if(lx>=0){
    let dx=Math.abs(tx-lx),sx=lx<tx?1:-1,dy=-Math.abs(ty-ly),sy=ly<ty?1:-1,er=dx+dy,x=lx,y=ly;
    while(true){stamp(x,y,tp,R);if(x===tx&&y===ty)break;const e2=2*er;if(e2>=dy){er+=dy;x+=sx}if(e2<=dx){er+=dx;y+=sy}}
  }else stamp(tx,ty,tp,R);
  lx=tx;ly=ty;
}
function stamp(cx_,cy_,tp,R){
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R+1)continue;
    const x=cx_+dx,y=cy_+dy;if(x<0||x>=cols||y<0||y>=rows)continue;
    const i=y*cols+x;
    if(tp===ERASE)grid[i]=EMPTY;
    else if(grid[i]===EMPTY||tp===FIRE)grid[i]=tp;
  }
}

let _rs=54321;function rng(){_rs=(_rs*1103515245+12345)&0x7fffffff;return _rs/0x7fffffff}
function ok(x,y){return x>=0&&x<cols&&y>=0&&y<rows}
function g(x,y){return ok(x,y)?grid[y*cols+x]:-1}
function sv(x,y,v){if(ok(x,y))nxt[y*cols+x]=v}
function sw(a,b){const t=nxt[a];nxt[a]=nxt[b];nxt[b]=t}
function mv(x,y,nx,ny){if(!ok(nx,ny)||nxt[ny*cols+nx]!==EMPTY)return false;sw(y*cols+x,ny*cols+nx);return true}

function uSand(x,y){
  const b=g(x,y+1);
  if(b===EMPTY||b===WATER||b===OIL){mv(x,y,x,y+1);return}
  if(b===LAVA){sv(x,y,EMPTY);return}
  const d=rng()<.5?-1:1;
  if(mv(x,y,x+d,y+1))return;mv(x,y,x-d,y+1);
}
function uWater(x,y){
  if(mv(x,y,x,y+1))return;
  const d=rng()<.5?-1:1;
  if(mv(x,y,x+d,y+1))return;if(mv(x,y,x-d,y+1))return;
  const sp=rng()<.5?-1:1,dist=Math.floor(rng()*5)+1;
  for(let i=1;i<=dist;i++){if(!mv(x,y,x+sp*i,y))break;if(g(x+sp*i,y+1)===EMPTY)break}
}
function uFire(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    if(g(x+dx,y+dy)===WATER){sv(x,y,EMPTY);return}
    if(g(x+dx,y+dy)===ICE){sv(x,y,EMPTY);sv(x+dx,y+dy,WATER);return}
  }
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(g(x+dx,y+dy)===WOOD&&rng()<.05)sv(x+dx,y+dy,FIRE);
    if(g(x+dx,y+dy)===OIL&&rng()<.1)sv(x+dx,y+dy,FIRE);
    if(g(x+dx,y+dy)===LAVA&&rng()<.2)sv(x+dx,y+dy,FIRE);
  }
  if(rng()<.08){sv(x,y,EMPTY);return}
  if(rng()<.7){if(mv(x,y,x,y-1))return;const d=rng()<.5?-1:1;if(mv(x,y,x+d,y-1))return;mv(x,y,x-d,y-1)}
}
function uOil(x,y){
  if(mv(x,y,x,y+1))return;
  if(g(x,y+1)===WATER){sw(y*cols+x,(y+1)*cols+x);return}
  if(rng()<.3){const d=rng()<.5?-1:1;if(mv(x,y,x+d,y+1))return;mv(x,y,x-d,y+1)}
  const sp=rng()<.5?-1:1;for(let i=1;i<=3;i++){if(!mv(x,y,x+sp*i,y))break}
}
function uLava(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(g(x+dx,y+dy)===WATER){sv(x,y,EMPTY);sv(x+dx,y+dy,EMPTY);return}
    if(g(x+dx,y+dy)===WOOD&&rng()<.15)sv(x+dx,y+dy,FIRE);
    if(g(x+dx,y+dy)===OIL&&rng()<.2)sv(x+dx,y+dy,FIRE);
  }
  if(rng()<.5){if(mv(x,y,x,y+1))return;const d=rng()<.5?-1:1;if(mv(x,y,x+d,y+1))return;mv(x,y,x-d,y+1)}
  if(rng()<.15){const sp=rng()<.5?-1:1;mv(x,y,x+sp,y)}
}
function uGold(x,y){
  const b=g(x,y+1);
  if(b===EMPTY)mv(x,y,x,y+1);
  const d=rng()<.5?-1:1;
  if(mv(x,y,x+d,y+1))return;mv(x,y,x-d,y+1);
}

function update(){
  nxt.set(grid);
  for(let y=rows-1;y>=0;y--){
    const xS=y%2===0?0:cols-1,xD=y%2===0?1:-1;
    for(let xi=0;xi<cols;xi++){
      const x=xS+xi*xD,t=grid[y*cols+x];
      if(t===EMPTY||t===STONE||t===WOOD)continue;
      switch(t){
        case SAND:uSand(x,y);break;case WATER:uWater(x,y);break;
        case FIRE:uFire(x,y);break;case OIL:uOil(x,y);break;
        case LAVA:uLava(x,y);break;case GOLD:uGold(x,y);break;
      }
    }
  }
  const tmp=grid;grid=nxt;nxt=tmp;
}

const imgD=cx.createImageData(W,H),px=imgD.data;
const stars=[];for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random()*.7,b:60+Math.floor(Math.random()*195),s:Math.random()<.25?2:1});

function render(){
  for(let i=0;i<px.length;i+=4){px[i]=8;px[i+1]=12;px[i+2]=24;px[i+3]=255}
  stars.forEach(s=>{for(let dy=0;dy<s.s;dy++)for(let dx=0;dx<s.s;dx++){const pi=((Math.floor(s.y*H)+dy)*W+(Math.floor(s.x*W)+dx))*4;if(pi>=0&&pi<px.length-3){px[pi]=s.b;px[pi+1]=s.b;px[pi+2]=s.b+20;px[pi+3]=255}}});
  const v=()=>Math.floor(rng()*30-15);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const t=grid[y*cols+x];if(t===EMPTY)continue;
    let r,g,b,a;const v2=v();
    switch(t){
      case SAND:r=190+v2;g=150+Math.floor(v2*.6);b=80+Math.floor(v2*.4);a=255;break;
      case WATER:r=30+v2;g=100+Math.floor(v2*.8);b=220+Math.floor(v2*.3);a=180;break;
      case FIRE:r=255;g=80+Math.floor(Math.random()*80);b=10+Math.floor(Math.random()*30);a=240;break;
      case WOOD:r=200+v2;g=120+Math.floor(v2*.5);b=30+Math.floor(v2*.3);a=255;break;
      case OIL:r=40+v2;g=35+Math.floor(v2*.3);b=15+Math.floor(v2*.2);a=220;break;
      case STONE:r=130+v2;g=130+v2;b=130+v2;a=255;break;
      case LAVA:r=230+Math.floor(Math.random()*25);g=50+Math.floor(Math.random()*40);b=5;a=255;break;
      case GOLD:r=255;g=215+Math.floor(Math.random()*20);b=0;a=255;break;
    }
    for(let dy=0;dy<S;dy++)for(let dx=0;dx<S;dx++){
      const px_=x*S+dx,py_=y*S+dy;if(px_>=W||py_>=H)continue;
      const pi=(py_*W+px_)*4;px[pi]=r;px[pi+1]=g;px[pi+2]=b;px[pi+3]=a;
    }
  }
  cx.putImageData(imgD,0,0);
}

(function loop(){update();render();requestAnimationFrame(loop)})();
</script>
</body>
</html>
