<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌦️ 天气粒子剧场 — AI 创造营第4课</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e2a;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;user-select:none}
canvas{display:block}
.toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.btn{padding:10px 20px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(10,14,42,.8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;backdrop-filter:blur(6px)}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.5)}
.btn.active{border-color:#ffd700;background:rgba(255,215,0,.2);color:#ffd700;box-shadow:0 0 16px rgba(255,215,0,.3)}
.title{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:12px;z-index:10;pointer-events:none;text-align:center}
.slider-wrap{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:20;color:#aaa;font-size:12px}
.slider-wrap input{width:160px;accent-color:#ffd700}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none;transition:opacity .06s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div class="toolbar" id="toolbar"></div>
<div class="slider-wrap">🎛️ 粒子数量 <input type="range" id="countSlider" min="50" max="3000" value="800"> <span id="countLabel">800</span></div>
<div class="title">🌦️ 天气粒子剧场 · 点击按钮切换天气</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}resize();addEventListener('resize',resize);

let weather='rain';
const WEATHERS=[
  {id:'rain',icon:'🌧️',label:'暴雨',bg:'#0a0e2a'},
  {id:'snow',icon:'❄️',label:'暴雪',bg:'#0c1228'},
  {id:'tornado',icon:'🌪️',label:'龙卷风',bg:'#0a0a1a'},
  {id:'sand',icon:'🏜️',label:'沙尘暴',bg:'#1a1208'},
  {id:'meteor',icon:'☄️',label:'流星雨',bg:'#060614'},
];
let particles=[];
const tb=document.getElementById('toolbar');
WEATHERS.forEach(w=>{
  const b=document.createElement('div');
  b.className='btn'+(w.id===weather?' active':'');
  b.innerHTML=w.icon+' '+w.label;
  b.onclick=()=>{weather=w.id;particles=[];tb.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
  tb.appendChild(b);
});

class P{
  constructor(){this.reset()}
  reset(){
    if(weather==='rain'){
      this.x=Math.random()*W;this.y=-10-Math.random()*H*.5;
      this.vx=-2-Math.random()*2;this.vy=12+Math.random()*8;
      this.size=1+Math.random()*2;this.alpha=.4+Math.random()*.4;
      this.color=`rgba(${100+Math.floor(Math.random()*50)},${150+Math.floor(Math.random()*50)},255,`;
    } else if(weather==='snow'){
      this.x=Math.random()*W;this.y=-10-Math.random()*50;
      this.vx=(Math.random()-.5)*2;this.vy=.5+Math.random()*1;
      this.size=2+Math.random()*3;this.alpha=.5+Math.random()*.5;
      this.wobble=Math.random()*Math.PI*2;this.wobbleSpeed=.02+Math.random()*.02;
      this.color=`rgba(220,230,255,`;
    } else if(weather==='tornado'){
      const angle=Math.random()*Math.PI*2;
      const dist=20+Math.random()*150;
      this.cx=W/2;this.cy=H*.4;
      this.angle=angle;this.dist=dist;this.yOff=Math.random()*H*.6;
      this.speed=.03+Math.random()*.05;
      this.size=1+Math.random()*2;this.alpha=.4+Math.random()*.4;
      this.color=`rgba(${180+Math.floor(Math.random()*40)},${200+Math.floor(Math.random()*40)},220,`;
    } else if(weather==='meteor'){
      this.x=W*.3+Math.random()*W*.4;this.y=-Math.random()*H*.3;
      const angle=Math.PI*.25+Math.random()*.3;
      const speed=6+Math.random()*8;
      this.vx=-Math.cos(angle)*speed;this.vy=Math.sin(angle)*speed;
      this.size=1+Math.random()*2;this.alpha=.6+Math.random()*.4;
      this.trail=[];this.maxTrail=8+Math.floor(Math.random()*10);
      const bright=Math.random()<.15;
      this.color=bright?`rgba(255,255,200,`:`rgba(${150+Math.floor(Math.random()*100)},${180+Math.floor(Math.random()*70)},255,`;
    } else {
      this.x=-10;this.y=Math.random()*H;
      this.vx=8+Math.random()*10;this.vy=(Math.random()-.5)*3;
      this.size=1+Math.random()*2;this.alpha=.3+Math.random()*.5;
      this.color=`rgba(${180+Math.floor(Math.random()*40)},${140+Math.floor(Math.random()*30)},${60+Math.floor(Math.random()*20)},`;
    }
    this.life=1;
  }
  update(){
    if(weather==='rain'){
      this.x+=this.vx;this.y+=this.vy;
      if(this.y>H+10||this.x<-10) this.reset();
    } else if(weather==='snow'){
      this.wobble+=this.wobbleSpeed;
      this.x+=this.vx+Math.sin(this.wobble)*.8;this.y+=this.vy;
      if(this.y>H+10) this.reset();
    } else if(weather==='tornado'){
      this.angle+=this.speed;this.yOff+=1.5;
      this.x=this.cx+Math.cos(this.angle)*this.dist*(1-this.yOff/(H*.6));
      this.y=this.cy+this.yOff;
      if(this.yOff>H*.6){this.yOff=0;this.dist=20+Math.random()*150;}
    } else if(weather==='meteor'){
      this.trail.push({x:this.x,y:this.y});
      if(this.trail.length>this.maxTrail) this.trail.shift();
      this.x+=this.vx;this.y+=this.vy;
      if(this.y>H+20||this.x<-20) this.reset();
    } else {
      this.x+=this.vx;this.y+=this.vy;
      if(this.x>W+10) this.reset();
    }
  }
  draw(){
    cx.beginPath();
    if(weather==='rain'){
      cx.moveTo(this.x,this.y);cx.lineTo(this.x+this.vx*2,this.y+this.vy*2);
      cx.strokeStyle=this.color+this.alpha+')';cx.lineWidth=this.size;cx.stroke();
    } else if(weather==='snow'){
      cx.arc(this.x,this.y,this.size,0,Math.PI*2);
      cx.fillStyle=this.color+this.alpha+')';cx.fill();
    } else if(weather==='tornado'){
      cx.arc(this.x,this.y,this.size,0,Math.PI*2);
      cx.fillStyle=this.color+this.alpha+')';cx.fill();
    } else if(weather==='meteor'){
      // 拖尾
      for(let i=0;i<this.trail.length;i++){
        const t=this.trail[i];
        const prog=i/this.trail.length;
        const a=this.alpha*prog*.6;
        cx.beginPath();
        cx.arc(t.x,t.y,this.size*prog,0,Math.PI*2);
        cx.fillStyle=this.color+a+')';
        cx.fill();
      }
      // 主星
      cx.beginPath(); cx.arc(this.x,this.y,this.size*1.5,0,Math.PI*2);
      cx.fillStyle=this.color+this.alpha+')'; cx.fill();
      // 光晕
      cx.beginPath(); cx.arc(this.x,this.y,this.size*4,0,Math.PI*2);
      cx.fillStyle=this.color+this.alpha*.15+')'; cx.fill();
    } else {
      cx.arc(this.x,this.y,this.size,0,Math.PI*2);
      cx.fillStyle=this.color+this.alpha+')';cx.fill();
    }
  }
}

/* ===== 滑块控制 ===== */
let targetCount=800;
const slider=document.getElementById('countSlider');
const label=document.getElementById('countLabel');
slider.oninput=()=>{ targetCount=parseInt(slider.value); label.textContent=targetCount; };

/* ===== 闪电 + 雷声 ===== */
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playThunder(){
  initAudio();
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*1.5,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const g=audioCtx.createGain();
  src.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.4,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1.5);
  src.start();
}
const flashEl=document.getElementById('flash');
let lastFlash=0;
function maybeLightning(){
  if(weather!=='rain') return;
  const now=Date.now();
  if(now-lastFlash>4000+Math.random()*5000){
    lastFlash=now;
    flashEl.style.opacity='.75';
    setTimeout(()=>{ flashEl.style.opacity='0'; },70);
    setTimeout(()=>{ flashEl.style.opacity='.4'; },150);
    setTimeout(()=>{ flashEl.style.opacity='0'; },220);
    playThunder();
  }
}

function loop(){
  const bg=WEATHERS.find(w=>w.id===weather);
  cx.fillStyle=bg?bg.bg:'#0a0e2a';cx.fillRect(0,0,W,H);
  maybeLightning();
  // 滑块控制数量
  if(particles.length<targetCount) particles.push(new P());
  else if(particles.length>targetCount) particles.length=targetCount;
  particles.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
